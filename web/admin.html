<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mDNS Studio · 组播域名管理控制台</title>
<style>
/* ============================================================
   Design tokens — 双主题（默认跟随系统，可手动切换）
   ============================================================ */
:root{
  --bg:#f2f4f9; --bg-soft:#e8ecf4;
  --shell:rgba(255,255,255,.62); --core:#ffffff;
  --ink:#101828; --ink-2:#5b6679; --ink-3:#98a2b3;
  --line:rgba(16,24,40,.09); --line-soft:rgba(16,24,40,.045);
  --accent:#4f46e5; --accent-2:#0891b2; --accent-soft:rgba(79,70,229,.09);
  --ok:#059669; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --inset:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.35);
  --shadow:0 28px 70px -38px rgba(16,24,40,.34);
  --shadow-soft:0 12px 32px -22px rgba(16,24,40,.3);
  --aurora-1:rgba(99,102,241,.16); --aurora-2:rgba(6,182,212,.12);
  --term:#0d1117; --term-ink:#cbd5e1;
  --grid-line:rgba(16,24,40,.03);
}
[data-theme="dark"]{
  --bg:#06080e; --bg-soft:#0a0e18;
  --shell:rgba(255,255,255,.045); --core:rgba(17,22,34,.88);
  --ink:#eef2ff; --ink-2:#98a3b8; --ink-3:#5d6a82;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.045);
  --accent:#818cf8; --accent-2:#22d3ee; --accent-soft:rgba(129,140,248,.12);
  --ok:#34d399; --warn:#fbbf24; --err:#f87171; --info:#60a5fa;
  --inset:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.02);
  --shadow:0 32px 90px -46px rgba(0,0,0,.95);
  --shadow-soft:0 14px 40px -28px rgba(0,0,0,.8);
  --aurora-1:rgba(99,102,241,.24); --aurora-2:rgba(34,211,238,.14);
  --term:#080b12; --term-ink:#b6c2d9;
  --grid-line:rgba(255,255,255,.022);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.mono{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono","Cascadia Code",Consolas,monospace}
.tabnum{font-variant-numeric:tabular-nums}

/* 背景层 */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(90px)}
.aurora::before{width:760px;height:760px;top:-320px;left:-160px;background:var(--aurora-1)}
.aurora::after{width:660px;height:660px;bottom:-360px;right:-140px;background:var(--aurora-2)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 40% 20%,#000 10%,transparent 78%);
  mask-image:radial-gradient(ellipse at 40% 20%,#000 10%,transparent 78%);}

/* ============================================================
   Layout — 浮动玻璃侧栏 + 非对称 Bento
   ============================================================ */
.rail{
  position:fixed;z-index:20;left:22px;top:22px;bottom:22px;width:236px;
  display:flex;flex-direction:column;padding:20px 14px 16px;
  border-radius:30px;border:1px solid var(--line);
  background:var(--shell);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 26px}
.brand-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 22px -8px var(--accent),inset 0 1px 0 rgba(255,255,255,.4)}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand-sub{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav-label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 10px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;
  color:var(--ink-2);font-weight:600;font-size:13px;text-align:left;width:100%;
  transition:background .55s cubic-bezier(.32,.72,0,1),color .55s cubic-bezier(.32,.72,0,1),transform .55s cubic-bezier(.32,.72,0,1)}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:var(--line-soft);color:var(--ink);transform:translateX(2px)}
.nav-item.on{background:var(--accent-soft);color:var(--accent)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:22%;height:56%;width:3px;border-radius:99px;
  background:linear-gradient(var(--accent),var(--accent-2));box-shadow:0 0 14px var(--accent)}
.rail-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line-soft)}
.rail-stat{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-bottom:7px}
.rail-stat b{color:var(--ink-2);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent);display:inline-block}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 18%,transparent)}
.pulse{animation:breathe 2.6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.42}}

.main{position:relative;z-index:2;margin-left:282px;padding:30px 40px 72px;max-width:1680px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--shell);font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:12px}
.eyebrow .tiny{width:5px;height:5px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,3.2vw,40px);line-height:1.08;letter-spacing:-.045em;font-weight:700;margin:0 0 7px}
.subtitle{color:var(--ink-2);font-size:13px;margin:0}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.status-pill{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:99px;
  border:1px solid var(--line);background:var(--shell);font-size:12px;font-weight:650;white-space:nowrap}
.status-pill .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 16%,transparent)}

/* 控件 */
.btn{display:inline-flex;align-items:center;gap:11px;padding:9px 10px 9px 18px;border-radius:99px;
  font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 12px 28px -14px var(--accent),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .6s cubic-bezier(.32,.72,0,1),box-shadow .6s cubic-bezier(.32,.72,0,1),filter .6s cubic-bezier(.32,.72,0,1)}
.btn .bico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);
  transition:transform .6s cubic-bezier(.32,.72,0,1)}
.btn:hover{filter:brightness(1.07);box-shadow:0 16px 34px -14px var(--accent)}
.btn:hover .bico{transform:translate(2px,-2px) scale(1.08)}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--shell);color:var(--ink-2);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.ghost:hover{color:var(--ink);background:var(--accent-soft);filter:none}
.btn.ghost .bico{background:var(--line-soft)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line);background:var(--shell);
  transition:transform .6s cubic-bezier(.32,.72,0,1),color .6s cubic-bezier(.32,.72,0,1),background .6s cubic-bezier(.32,.72,0,1)}
.icon-btn:hover{transform:rotate(12deg);color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:11.5px;font-weight:650;
  border:1px solid var(--line);background:var(--shell);color:var(--ink-2);
  transition:all .5s cubic-bezier(.32,.72,0,1)}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:750;
  letter-spacing:.04em;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.b-A{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.b-AAAA{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.b-PTR{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.b-SRV{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.b-TXT{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.b-ANY{background:var(--line-soft);color:var(--ink-2)}
.b-OTHER{background:var(--line-soft);color:var(--ink-3)}

/* Double-Bezel 卡片 */
.bezel{border-radius:26px;padding:6px;border:1px solid var(--line);background:var(--shell);box-shadow:var(--shadow)}
.core{border-radius:20px;padding:22px 24px;background:var(--core);box-shadow:var(--inset);height:100%}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.card-title{font-size:14px;font-weight:700;letter-spacing:-.015em;margin:0}
.card-sub{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s7{grid-column:span 7}.s8{grid-column:span 8}.s6{grid-column:span 6}.s12{grid-column:span 12}

/* 指标卡 */
.metric{position:relative;overflow:hidden}
.metric .core{padding:20px 22px 16px}
.metric-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.metric-num{font-size:clamp(26px,2.6vw,36px);font-weight:700;letter-spacing:-.055em;line-height:1.1;margin:10px 0 2px}
.metric-foot{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.metric-foot .up{color:var(--ok);font-weight:700}
.spark{position:absolute;right:14px;bottom:12px;width:96px;height:38px;opacity:.65}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:0 12px 11px;border-bottom:1px solid var(--line-soft)}
.tbl td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tbody tr{transition:background .45s cubic-bezier(.32,.72,0,1)}
.tbl tbody tr:hover{background:var(--line-soft)}
.tbl tbody tr:last-child td{border-bottom:0}
.t-name{font-weight:650;letter-spacing:-.01em}
.t-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--ink-2)}
.t-muted{color:var(--ink-3);font-size:11.5px}
.empty{padding:34px 12px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* 表单 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.inp{width:100%;padding:10px 13px;border-radius:12px;background:var(--bg-soft);color:var(--ink);
  border:1px solid var(--line);outline:none;font-size:12.5px;
  transition:border-color .5s cubic-bezier(.32,.72,0,1),box-shadow .5s cubic-bezier(.32,.72,0,1),background .5s cubic-bezier(.32,.72,0,1)}
.inp:focus{border-color:var(--accent);background:var(--core);box-shadow:0 0 0 4px var(--accent-soft)}
.inp::placeholder{color:var(--ink-3)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);flex:none;
  transition:background .5s cubic-bezier(.32,.72,0,1)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .55s cubic-bezier(.32,.72,0,1)}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch.on::after{transform:translateX(17px)}
.row-del{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);
  transition:all .45s cubic-bezier(.32,.72,0,1)}
.row-del:hover{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent);transform:rotate(90deg)}
.row-open{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 11px;border-radius:99px;
  font-size:11px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;
  background:var(--accent-soft);transition:all .45s cubic-bezier(.32,.72,0,1)}
.row-open:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);transform:translateY(-1px)}
.cell-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.editor{width:100%;min-height:440px;resize:vertical;padding:18px 20px;border-radius:16px;
  background:var(--term);color:var(--term-ink);border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;line-height:1.75;outline:none;
  tab-size:2}
.editor:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:16px 20px;border-radius:18px;border:1px dashed var(--line);background:var(--shell)}
.dirty{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--warn);font-weight:650}
.dirty.hide{visibility:hidden}

/* 拓扑图 */
.topo{width:100%;height:auto;display:block}
.topo .link{fill:none;stroke:url(#linkGrad);stroke-width:1.4;opacity:.65}
.topo .node-box{fill:var(--core);stroke:var(--line);stroke-width:1}
.topo .node-title{fill:var(--ink);font-size:12px;font-weight:700;font-family:inherit}
.topo .node-sub{fill:var(--ink-3);font-size:10.5px;font-family:ui-monospace,Consolas,monospace}
.topo .wave{fill:none;stroke:var(--accent);transform-origin:110px 150px;animation:wave 4.2s cubic-bezier(.32,.72,0,1) infinite}
.topo .wave.w2{animation-delay:1.4s}.topo .wave.w3{animation-delay:2.8s}
@keyframes wave{0%{transform:scale(.55);opacity:.65}100%{transform:scale(1.75);opacity:0}}
.topo .hub{fill:url(#hubGrad)}
.topo .hub-t{fill:#fff;font-size:11px;font-weight:700;font-family:inherit;text-anchor:middle}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-label{width:52px;font-size:11px;font-weight:700;color:var(--ink-2);font-family:ui-monospace,Consolas,monospace}
.bar-track{flex:1;height:7px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transform-origin:left;animation:grow .95s cubic-bezier(.32,.72,0,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-num{width:26px;text-align:right;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 终端日志 */
.term{background:var(--term);border-radius:16px;border:1px solid var(--line);padding:14px 6px 14px 14px;
  height:460px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;line-height:1.75}
.log-line{display:flex;gap:10px;padding:2px 8px 2px 0;border-radius:5px;white-space:pre-wrap;word-break:break-word}
.log-line:hover{background:rgba(255,255,255,.035)}
.log-time{color:#4b5b74;flex:none}
.log-lv{flex:none;width:52px;font-weight:700}
.lv-INFO{color:#4ade80}.lv-DEBUG{color:#64748b}.lv-WARNING{color:#fbbf24}.lv-ERROR{color:#f87171}
.log-msg{color:var(--term-ink)}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}

/* 探针 */
.probe-input{display:flex;gap:10px;flex-wrap:wrap}
.probe-input .inp{flex:1;min-width:240px;padding:14px 16px;font-size:13.5px;border-radius:14px}
.probe-input select.inp{width:132px;flex:none}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rec-card{padding:15px 17px;border-radius:16px;border:1px solid var(--line);background:var(--bg-soft);
  animation:rise .7s cubic-bezier(.32,.72,0,1) both}
.rec-card .rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.rec-card .rc-name{font-size:12.5px;font-weight:700;word-break:break-all}
.rec-card .rc-val{font-size:12px;color:var(--ink-2);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}

/* Toast / modal */
.toasts{position:fixed;z-index:60;top:22px;right:22px;display:flex;flex-direction:column;gap:10px;pointer-events:none}

/* 状态灯 + 健康卡 */
.ldot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-3)}
.ldot.up{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 16%,transparent);animation:lbreathe 2.4s ease-in-out infinite}
.ldot.down{background:var(--err);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 16%,transparent)}
.ldot.unknown{background:var(--ink-3)}
@keyframes lbreathe{0%,100%{opacity:1}50%{opacity:.45}}
.health-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
  border:1px solid var(--line-soft);background:var(--bg-soft);transition:background .45s}
.health-item:hover{background:var(--accent-soft)}
.hi-main{flex:1;min-width:0}
.hi-label{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-target{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Consolas,monospace;margin-top:2px}
.hi-lat{font-size:11px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap}
.health-item.down .hi-lat{color:var(--err)}
.health-item.unknown .hi-lat{color:var(--ink-3)}
.hi-kind{font-size:9px;font-weight:750;letter-spacing:.1em;padding:3px 7px;border-radius:6px;
  background:var(--line-soft);color:var(--ink-3);text-transform:uppercase;flex:none}
/* 健康列表纵向节奏 + 状态色左轨（扫读式状态板） */
.health-list{display:flex;flex-direction:column;gap:10px}
.health-item{border-left:3px solid var(--line-soft)}
.health-item.up{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 5%,var(--bg-soft))}
.health-item.down{border-left-color:var(--err);background:color-mix(in srgb,var(--err) 6%,var(--bg-soft))}
.health-item.unknown{border-left-color:var(--ink-3)}

#view.noanim .bezel,#view.noanim .health-item,#view.noanim .map-card,
#view.noanim .conflict-card,#view.noanim .tbl tbody tr{animation:none!important}

/* 局域网地图 */
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.map-card{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg-soft);
  animation:rise .7s cubic-bezier(.32,.72,0,1) both;position:relative;overflow:hidden}
.map-card.ours{border-color:color-mix(in srgb,var(--accent) 32%,transparent);
  background:linear-gradient(180deg,var(--accent-soft),var(--bg-soft))}
.map-card .mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.map-card .mc-name{font-size:13px;font-weight:750;letter-spacing:-.01em;word-break:break-all}
.map-card .mc-type{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,Consolas,monospace;margin-top:2px;word-break:break-all}
.map-card .mc-loc{font-size:11px;color:var(--ink-2);margin-top:8px;font-family:ui-monospace,Consolas,monospace}
.map-card .mc-ttl{font-size:10px;color:var(--ink-3);margin-top:4px}
.mc-ours{font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 8px;border-radius:6px}
.mc-ext{font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);
  background:color-mix(in srgb,var(--ok) 14%,transparent);padding:3px 8px;border-radius:6px}

/* 审计表 */
.audit-hit{color:var(--ok);font-weight:700}.audit-miss{color:var(--ink-3)}
.audit-cli{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-2)}

/* 冲突卡 */
.conflict-card{padding:14px 16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--err) 30%,var(--line));
  background:color-mix(in srgb,var(--err) 6%,var(--bg-soft));animation:rise .7s cubic-bezier(.32,.72,0,1) both}
.conflict-card .cc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.conflict-card .cc-name{font-size:13px;font-weight:750}
.conflict-card .cc-detail{font-size:11.5px;color:var(--ink-2);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.cc-tag{font-size:9.5px;font-weight:750;letter-spacing:.06em;color:var(--err);
  background:color-mix(in srgb,var(--err) 12%,transparent);padding:3px 9px;border-radius:7px}
.toast{display:flex;align-items:center;gap:11px;min-width:250px;max-width:380px;padding:13px 16px;border-radius:16px;
  border:1px solid var(--line);background:var(--core);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;
  animation:toastIn .65s cubic-bezier(.32,.72,0,1) both;pointer-events:auto}
.toast.ok{border-left:3px solid var(--ok)}.toast.err{border-left:3px solid var(--err)}.toast.info{border-left:3px solid var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}
.modal-mask{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
  background:rgba(6,8,14,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.modal{width:min(430px,100%);padding:26px;border-radius:24px;background:var(--core);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:17px;letter-spacing:-.02em}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:12.5px}
.demo-note{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:10.5px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent)}
.anim{animation:rise .75s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.11s}.d3{animation-delay:.17s}.d4{animation-delay:.23s}
.d5{animation-delay:.29s}.d6{animation-delay:.35s}

@media (max-width:1180px){
  .s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .rail{position:relative;left:auto;top:auto;bottom:auto;width:auto;margin:16px 16px 0;padding:14px;border-radius:24px}
  .brand{padding:2px 6px 12px}.nav-label,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}
  .nav-item{width:auto;white-space:nowrap;padding:9px 13px}
  .nav-item.on::before{display:none}
  .main{margin-left:0;padding:24px 16px 56px}
  .grid12{grid-template-columns:1fr;gap:14px}
  .s3,.s4,.s5,.s6,.s7,.s8,.s12{grid-column:span 1}
  .form-grid{grid-template-columns:1fr}
  .core{padding:18px}
  .topbar{align-items:flex-start}
}

async function api(path,opts){
  opts=opts||{};
  const headers={'Content-Type':'application/json'};
  if(S.token) headers['X-Admin-Token']=S.token;
  if(S.adminPw) headers['X-Admin-Password']=S.adminPw;
  const res=await fetch(BASE+path,Object.assign({},opts,{headers:Object.assign(headers,opts.headers||{})}));
  if(res.status===401){askToken();throw new Error('需要访问令牌');}
  let body={};try{body=await res.json();}catch(e){body={};}
  if(!res.ok){
    // 密码被改 / 缓存失效时清掉会话内缓存，下次写操作会重新弹窗
    if(body.code==='auth_failed'&&path!=='/api/auth/verify')forgetPw();
    throw new Error(body.error||('HTTP '+res.status));
  }
  return body;
}
function toast(msg,kind){
  kind=kind||'info';
  const el=document.createElement('div');
  el.className='toast '+kind;
  el.innerHTML='<span style="color:var(--'+(kind==='ok'?'ok':kind==='err'?'err':'accent')+')">'+icon(kind==='ok'?'check':kind==='err'?'close':'broadcast',16)+'</span><span>'+esc(msg)+'</span>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(function(){el.style.transition='opacity .5s,transform .5s';el.style.opacity='0';el.style.transform='translateX(24px)';setTimeout(function(){el.remove();},520);},3400);
}
function askToken(){
  const v=window.prompt('管理接口需要访问令牌（management_token）：',S.token||'');

}

function applyTheme(){

async function refreshAll(){

async function refreshInsights(){
  if(S.demo)return;

    const [health,queries,browse,conflicts]=await Promise.all([
      api('/api/health'),api('/api/queries?limit=100'),
      api('/api/browse'),api('/api/conflicts')]);

function startSSE(){
  if(S.demo||S.es)return;
  try{
    const url=BASE+'/api/logs/stream'+(S.token?'?token='+encodeURIComponent(S.token):'');
    S.es=new EventSource(url);
    S.es.onmessage=function(ev){
      try{const item=JSON.parse(ev.data);S.logs.push(item);if(S.logs.length>600)S.logs.shift();appendLog(item);}catch(e){}
    };
    S.es.onerror=function(){/* 断线由定时刷新兜底 */};
  }catch(e){}
}

function syncFromDom(){
  if(S.tab!=='config'||S.configMode!=='form'||!S.config)return;
  const server={};
  document.querySelectorAll('[data-srv]').forEach(function(el){
    const k=el.dataset.srv,kind=el.dataset.kind;
    if(kind==='number'){const v=String(el.value==null?'':el.value).trim();if(v!=='')server[k]=Number(v);}
    else if(kind==='list')server[k]=String(el.value||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
    else server[k]=el.value;
  });
  ['reverse_ptr','management','health','browse','audit','conflict_detect',
   'gateway','alert','alert_on_health','alert_on_conflict'].forEach(function(k){
    const el=document.querySelector('.switch[data-key="'+k+'"]');
    if(el)server[k]=el.classList.contains('on');
  });
  const hosts=[].slice.call(document.querySelectorAll('.host-row')).map(function(r){
    return {name:r.querySelector('[data-key="name"]').value.trim(),ip:r.querySelector('[data-key="ip"]').value.trim()};
  }).filter(function(h){return h.name||h.ip;});
  const services=[].slice.call(document.querySelectorAll('.svc-row')).map(function(r){
    const g=function(k){const e=r.querySelector('[data-key="'+k+'"]');return e?e.value.trim():'';};
    const proxEl=r.querySelector('[data-key="proxy"]');
    const proxy = proxEl ? proxEl.classList.contains('on') : true;
    return {type:g('type'),instance:g('instance'),host:g('host'),ip:g('ip'),
            port:Number(g('port')||0),txt:strToTxt(g('txt')),proxy:proxy};
  }).filter(function(s){return s.type||s.instance||s.ip;});
  S.config.config={server:server,hosts:hosts,services:services};
}

  const empty=box.querySelector('.empty');if(empty)empty.remove();

    '<span>耗时 <b class="mono" style="color:var(--ink)">'+esc(String(p.elapsed_ms))+' ms</b></span>'+
    '<span>应答包 <b class="mono" style="color:var(--ink)">'+esc(String(p.packets))+'</b></span>'+
    '<span>记录 <b class="mono" style="color:var(--ink)">'+p.records.length+'</b></span></div>'+
    '<div class="result-grid">'+p.records.map(function(r,i){
      const cls=['A','AAAA','PTR','SRV','TXT'].includes(r.type)?'b-'+r.type:'b-OTHER';
      return '<div class="rec-card" style="animation-delay:'+(i*.05)+'s"><div class="rc-top"><span class="badge '+cls+'">'+esc(r.type)+'</span><span class="t-muted">'+esc(r.section)+'</span></div>'+
        '<div class="rc-name">'+esc(r.name)+'</div><div class="rc-val">'+esc(r.value)+'</div>'+

/* ============================================================
   Health / Map / Audit / Conflicts
   ============================================================ */
function fmtAgo(ts){
  if(!ts)return '—';
  const s=Math.max(0,Math.floor((Date.now()/1000-ts)));
  if(s<5)return '刚刚';
  if(s<60)return s+' 秒前';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}
function viewHealth(){
  const h=S.health||{enabled:false,items:[]};
  const items=h.items||[];
  const up=items.filter(function(x){return x.status==='up';}).length;
  const down=items.filter(function(x){return x.status==='down';}).length;
  const unknown=items.filter(function(x){return x.status==='unknown';}).length;
  const innerList=items.length?items.map(function(t,i){
    const st=t.status||'unknown';
    return '<div class="health-item '+st+'" style="animation:rise .6s cubic-bezier(.32,.72,0,1) both;animation-delay:'+(i*.05)+'s">'+
      '<span class="ldot '+st+'"></span>'+
      '<div class="hi-main"><div class="hi-label">'+esc(t.label)+' <span class="hi-kind">'+esc(t.kind||'')+'</span></div>'+
      '<div class="hi-target">'+esc(t.target||(''+t.ip+':'+t.port))+'</div></div>'+
      '<div class="hi-lat">'+(st==='up'?(t.latency_ms!=null?esc(String(t.latency_ms))+' ms':'可达'):st==='down'?'不可达':'待探测')+'</div>'+
      '<span class="t-muted" style="font-size:11px;min-width:64px;text-align:right">'+(t.checked_at?esc(fmtAgo(t.checked_at)):'—')+'</span>'+
      '</div>';
  }).join(''):'<div class="empty" style="padding:44px">'+icon('heart',26)+'<div style="margin-top:12px">没有可探测的目标（未配置 host / service）</div></div>';
  const rows=items.length?'<div class="health-list">'+innerList+'</div>':innerList;
  const sum=metric('目标总数','<span class="tabnum">'+items.length+'</span>',
    '<span class="up">'+up+'</span> 在线 · <span style="color:var(--err);font-weight:700">'+down+'</span> 掉线 · <span class="t-muted">'+unknown+'</span> 待探测',1,'d1')+
    metric('在线率',items.length?Math.round(up/items.length*100)+'%':'—',
      h.enabled?'探测周期 '+esc(h.interval||0)+' s / 超时 '+esc(h.timeout_s||2)+' s':'健康监控已关闭',2,'d2')+
    metric('掉线目标','<span class="tabnum">'+down+'</span>',down?'需检查对应服务/网络':'全部目标在线 ✓',3,'d3');
  return '<div class="grid12">'+sum+
    card('目标状态灯','周期 TCP 探测已登记的 host（80）与 service（ip:port）',rows,'s12','d4')+
  '</div>';
}
function viewMap(){
  const b=S.browse||{enabled:false,items:[],count:0};
  const items=b.items||[];
  const ext=items.filter(function(x){return !x.ours;}).length;
  const own=items.length-ext;
  const cards=items.length?items.map(function(it,i){
    const port=it.port!=null?it.port:'?';
    const loc=it.host_ip?it.host_ip:(it.host||'');
    return '<div class="map-card'+(it.ours?' ours':'')+'" style="animation-delay:'+(i*.04)+'s">'+
      '<div class="mc-top"><div><div class="mc-name">'+esc(it.instance)+'</div>'+
      '<div class="mc-type">'+esc(it.type||'')+'</div></div>'+
      '<span class="'+(it.ours?'mc-ours':'mc-ext')+'">'+(it.ours?'本机':'外部')+'</span></div>'+
      '<div class="mc-loc">SRV '+esc(loc)+':<b>'+esc(String(port))+'</b>'+(it.txt?' · TXT '+esc(String(it.txt).slice(0,42)):'')+'</div>'+
      '<div class="mc-ttl">TTL '+esc(String(it.ttl||'—'))+' · 来自 '+esc(it.source||'—')+' · '+esc(fmtAgo(it.last_seen))+'</div>'+
      '</div>';
  }).join(''):'<div class="empty" style="padding:44px">'+icon('globe',26)+'<div style="margin-top:12px">尚未发现外部服务实例（等待局域网内其它 mDNS 设备的应答，或等待下一轮枚举）</div></div>';
  const sum=metric('发现实例','<span class="tabnum">'+items.length+'</span>',
    '<span class="up">'+ext+'</span> 外部 · <span style="font-weight:700">'+own+'</span> 本机（自身宣告回显）',4,'d1')+
    metric('外部实例','<span class="tabnum">'+ext+'</span>',b.enabled?'枚举周期 '+esc(b.scan_interval||0)+' s':'服务浏览已关闭',5,'d2')+
    metric('最近扫描',items.length?esc(fmtAgo(b.last_scan)):'—','被动摄取实时进行 · 主动枚举周期触发',6,'d3');
  return '<div class="grid12">'+sum+
    card('局域网服务地图','摄取局域网内其它 mDNS / DNS-SD 服务实例（本机回显标记为「本机」）',
      '<div class="map-grid">'+cards+'</div>','s12','d4')+
  '</div>';
}
function viewAudit(){
  const q=S.queries||{enabled:false,items:[],total:0};
  const items=(q.items||[]).slice(0,80);
  const hits=(q.items||[]).filter(function(x){return x.hit;}).length;
  const rows=items.length?items.map(function(r,i){
    return '<tr style="animation:rise .5s both;animation-delay:'+(i*.02)+'s">'+
      '<td class="t-mono t-muted">'+esc(r.time||'')+'</td>'+
      '<td class="audit-cli">'+esc(r.client||'')+'</td>'+
      '<td class="t-name">'+esc((r.names||[]).join(', '))+'</td>'+
      '<td><span class="badge b-ANY">'+esc((r.qtypes||[]).join(', ')||'—')+'</span></td>'+
      '<td>'+(r.hit?'<span class="audit-hit">命中</span>':'<span class="audit-miss">未命中</span>')+(r.unicast?' <span class="t-muted" style="font-size:10px">QU</span>':'')+'</td>'+
      '</tr>';
  }).join(''):'<tr><td colspan="5" class="empty">'+(q.enabled?'暂无查询记录':'查询审计已关闭')+'</td></tr>';
  return '<div class="grid12">'+
    metric('累计查询','<span class="tabnum">'+fmtNum(q.total||0)+'</span>',
      '缓冲保留最近 '+fmtNum(q.buffer||0)+' 条 · 最新在前',1,'d1')+
    metric('最近命中',hits+' / '+items.length,items.length?'命中率 '+(items.length?Math.round(hits/items.length*100):0)+'%':'无数据',2,'d2')+
    card('查询审计流','谁在查什么、是否命中（环形缓冲，最新在前）',
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>时间</th><th>客户端</th><th>查询对象</th><th>类型</th><th>结果</th></tr></thead><tbody>'+rows+'</tbody></table></div>','s12','d3')+
  '</div>';
}
function viewConflicts(){
  const c=S.conflicts||{enabled:false,items:[],count:0};
  const items=c.items||[];
  const cards=items.map(function(x,i){
    return '<div class="conflict-card" style="animation-delay:'+(i*.05)+'s">'+
      '<div class="cc-top"><div class="cc-name"><span class="cc-tag">'+esc(x.rtype)+'</span> '+esc(x.name)+'</div>'+
      '<span class="t-muted" style="font-size:11px">出现 '+esc(String(x.count))+' 次 · '+esc(fmtAgo(x.last_seen))+'</span></div>'+
      '<div class="cc-detail">本地: 已发布该记录（值见 DNS 记录页）<br>对方: '+(x.theirs&&x.theirs.length?esc(x.theirs.join('  /  ')):'—')+'</div>'+
      '<div class="t-muted" style="font-size:11px;margin-top:8px">来源 '+esc(x.source||'—')+'</div>'+
      '</div>';
  }).join('');
  const empty=cards||('<div class="empty" style="padding:44px">'+icon('alert',26)+'<div style="margin-top:12px">'+
      (c.enabled?'未检测到名称冲突 · 局域网内没有同名异值的记录':'冲突检测已关闭')+'</div></div>');
  return '<div class="grid12">'+
    metric('冲突数','<span class="tabnum">'+(c.count||0)+'</span>',
      c.enabled?'本地同名异值的外来记录（RFC 6762 §4 防御）':'冲突检测已关闭',7,'d1')+
    card('名称冲突登记','外来应答中，与本地发布同名同类型但值不同的记录',
      '<div style="display:grid;gap:12px">'+empty+'</div>','s12','d2')+
  '</div>';
}

/* ============================================================
   Actions
   ============================================================ */
function setTab(t){if(S.tab===t)return;syncFromDom();S.tab=t;
  var v=document.getElementById('view');if(v)v.classList.remove('noanim'); // 主动切 tab：恢复入场动画
  render();}
function setConfigMode(m){syncFromDom();S.configMode=m;S.dirty=false;renderTab();}
function forgetPw(){S.adminPw='';try{sessionStorage.removeItem('mdns.adminpw');}catch(e){}}
function rememberPw(pw){S.adminPw=pw;try{sessionStorage.setItem('mdns.adminpw',pw);}catch(e){}}
function passwordModal(title,needConfirm){
  return new Promise(function(resolve){
    const root=document.getElementById('modalRoot');
    root.innerHTML='<div class="modal-mask"><div class="modal">'+
      '<h3>'+esc(title)+'</h3>'+
      '<p>'+(needConfirm?'首次使用请设置管理员密码（至少 8 位）。之后修改配置、回滚与改密都需要输入它。':'请输入管理员密码以继续本次写操作。密码只在本次会话内缓存。')+'</p>'+
      '<div class="field"><label>'+(needConfirm?'新密码':'管理员密码')+'</label>'+
        '<input class="inp" id="pwA" type="password" autocomplete="new-password" placeholder="'+(needConfirm?'至少 8 位':'管理员密码')+'"></div>'+
      (needConfirm?'<div class="field" style="margin-top:12px"><label>再输入一次</label><input class="inp" id="pwB" type="password" autocomplete="new-password" placeholder="确认新密码"></div>':'')+
      '<div id="pwErr" style="color:var(--err);font-size:11.5px;margin-top:10px;min-height:16px"></div>'+
      '<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px">'+
        '<button class="btn ghost" id="pwCancel">取消</button>'+
        '<button class="btn" id="pwOk">确定<span class="bico">'+icon('arrow',14)+'</span></button></div>'+
      '</div></div>';
    function close(v){root.innerHTML='';resolve(v);}
    document.getElementById('pwCancel').onclick=function(){close('');};
    document.getElementById('pwOk').onclick=function(){
      const a=document.getElementById('pwA').value,err=document.getElementById('pwErr');
      if(needConfirm){
        const b=document.getElementById('pwB').value;
        if(a.length<8){err.textContent='密码至少 8 位';return;}
        if(a!==b){err.textContent='两次输入不一致';return;}
      }else if(!a){err.textContent='请输入密码';return;}
      close(a);
    };
    const a=document.getElementById('pwA');a.focus();
    a.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pwOk').click();});
  });
}
async function ensureAdminPassword(){
  if(S.demo)return true;
  if(!S.auth){try{S.auth=await api('/api/auth');}catch(e){S.auth={enabled:false};}}
  if(!S.auth.enabled){
    const pw=await passwordModal('首次设置管理员密码',true);
    if(!pw)return false;
    try{await api('/api/auth/password',{method:'POST',body:JSON.stringify({new_password:pw})});}
    catch(e){toast('设置失败：'+e.message,'err');return false;}
    rememberPw(pw);S.auth={enabled:true,updated_at:'刚刚'};
    toast('管理员密码已设置，请妥善保管','ok');
    return true;
  }
  if(S.adminPw){
    try{const r=await api('/api/auth/verify',{method:'POST',body:'{}'});if(r.ok)return true;}catch(e){}
    forgetPw();
  }
  const pw=await passwordModal('请输入管理员密码',false);
  if(!pw)return false;
  rememberPw(pw);
  try{
    const r=await api('/api/auth/verify',{method:'POST',body:'{}'});
    if(!r.ok){forgetPw();toast('密码错误','err');return false;}
    return true;
  }catch(e){forgetPw();toast('密码校验失败：'+e.message,'err');return false;}
}
async function changePassword(){
  if(S.demo){toast('演示模式：不修改密码','info');return;}
  if(!(await ensureAdminPassword()))return;
  const pw=await passwordModal('设置新的管理员密码',true);
  if(!pw)return;
  try{
    await api('/api/auth/password',{method:'POST',body:JSON.stringify({new_password:pw})});
    rememberPw(pw);
    S.auth=await api('/api/auth');
    toast('管理员密码已修改','ok');renderTab();
  }catch(e){toast('修改失败：'+e.message,'err');}
}
async function doRollback(id){
  if(!id)return;
  if(!(await ensureAdminPassword()))return;
  if(!window.confirm('确定回滚到该版本？当前配置会先自动存一份快照。'))return;
  try{
    const r=await api('/api/config/rollback',{method:'POST',body:JSON.stringify({id:id})});
    toast(r.message||'已回滚','ok');
    setTimeout(async function(){try{await refreshAll();renderTab();}catch(e){}},700);
  }catch(e){toast('回滚失败：'+e.message,'err');}
}
async function refreshExtras(){
  if(S.demo)return;
  try{
    const [a,h,al]=await Promise.all([
      api('/api/auth').catch(function(){return null;}),
      api('/api/config/history').catch(function(){return null;}),
      api('/api/alerts').catch(function(){return null;})]);
    if(a)S.auth=a;if(h)S.history=h;if(al)S.alerts=al;
    const v=document.getElementById('view');if(v)v.classList.add('noanim');
    renderTab();
  }catch(e){}
}
async function saveConfig(){
  syncFromDom();
  const payload=S.configMode==='raw'?{raw:(document.getElementById('rawEditor')||{}).value||''}:{config:S.config.config};
  if(S.demo){S.dirty=false;toast('演示模式：配置已在本地模拟保存，未写入服务','info');renderTab();return;}
  if(!(await ensureAdminPassword()))return;
  try{
    const r=await api('/api/config',{method:'POST',body:JSON.stringify(payload)});
    S.dirty=false;toast(r.message||'配置已保存','ok');
    if(r.restart_required)toast('端口/网卡变更需重启进程才会生效','info');
    setTimeout(async function(){try{await refreshAll();renderTab();}catch(e){}},700);
  }catch(e){toast('保存失败：'+e.message,'err');}
}
async function reloadService(){
  if(S.demo){toast('演示模式：已模拟重新载入','info');return;}
  try{await api('/api/reload',{method:'POST',body:'{}'});toast('已触发配置重载','ok');setTimeout(refreshStatus,600);}
  catch(e){toast('重载失败：'+e.message,'err');}
}
async function runProbe(name,type){
  if(!name)return toast('请输入要查询的域名','err');
  S.probeName=name;S.probeType=type||'ANY';
  if(S.demo){
    S.probe={name:name,type:type,group:'224.0.0.251',port:5353,packets:1,elapsed_ms:24,
      records:[{section:'ANSWER',name:'nas.local',type:'A',ttl:120,value:'172.15.103.30',from:'172.15.103.30:5353'},
               {section:'ANSWER',name:name,type:'PTR',ttl:120,value:'Office Web._http._tcp.local.',from:'172.15.103.30:5353'},
               {section:'ADDITIONAL',name:'nas.local',type:'A',ttl:120,value:'172.15.103.30',from:'172.15.103.30:5353'}]};
    renderTab();toast('演示模式：返回模拟应答','info');return;
  }
  toast('正在发送组播查询…','info');
  try{S.probe=await api('/api/probe',{method:'POST',body:JSON.stringify({name:name,type:type})});renderTab();
    toast(S.probe.records.length?'收到 '+S.probe.records.length+' 条记录':'未收到应答','ok');}
  catch(e){toast('查询失败：'+e.message,'err');}
}
function addRow(kind){
  syncFromDom();
  if(kind==='host')S.config.config.hosts.push({name:'',ip:''});
  else S.config.config.services.push({type:'_http._tcp.local',instance:'',host:'',ip:'',port:8080,txt:{},proxy:true});
  S.dirty=true;renderTab();
  setTimeout(function(){const rows=document.querySelectorAll(kind==='host'?'.host-row':'.svc-row');const last=rows[rows.length-1];if(last){const i=last.querySelector('input');if(i)i.focus();}},60);
}
function delRow(kind,idx){
  syncFromDom();
  const key=kind==='host'?'hosts':'services';
  S.config.config[key].splice(idx,1);S.dirty=true;renderTab();
}
function downloadLogs(){
  const text=S.logs.map(function(l){return (l.time||'')+' '+(l.level||'')+' '+(l.msg||'');}).join('\n');
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='mdns-logs.txt';a.click();URL.revokeObjectURL(a.href);
  toast('日志已导出','ok');
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tab')setTab(el.dataset.tab);
  else if(a==='theme')toggleTheme();
  else if(a==='endpoint')setEndpoint();
  else if(a==='refresh'){(async function(){try{if(!S.demo){await refreshAll();toast('数据已刷新','ok');}else toast('演示模式：数据为本地模拟','info');render();}catch(x){toast('刷新失败：'+x.message,'err');}})();}
  else if(a==='token')askToken();
  else if(a==='config-mode')setConfigMode(el.dataset.mode);
  else if(a==='toggle'){el.classList.toggle('on');markDirty();}
  else if(a==='add-host')addRow('host');
  else if(a==='add-service')addRow('service');
  else if(a==='del-host')delRow('host',Number(el.dataset.idx));
  else if(a==='del-service')delRow('service',Number(el.dataset.idx));
  else if(a==='save')saveConfig();
  else if(a==='change-password')changePassword();
  else if(a==='rollback')doRollback(el.dataset.id);
  else if(a==='history-refresh')refreshExtras();
  else if(a==='reload')reloadService();
  else if(a==='filter-type'){S.typeFilter=el.dataset.type;renderTab();}
  else if(a==='log-level'){S.logLevel=el.dataset.level;renderTab();}
  else if(a==='autoscroll'){S.autoScroll=!S.autoScroll;renderTab();}
  else if(a==='clear-logs'){S.logs=[];renderTab();toast('日志已清空','ok');}
  else if(a==='download-logs')downloadLogs();
  else if(a==='probe'){runProbe((document.getElementById('probeName')||{}).value.trim(),(document.getElementById('probeType')||{}).value||'ANY');}
  else if(a==='probe-preset'){
    const n=document.getElementById('probeName'),t=document.getElementById('probeType');
    if(n)n.value=el.dataset.name;if(t)t.value=el.dataset.type;
    runProbe(el.dataset.name,el.dataset.type);
  }
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='rawEditor'||t.hasAttribute('data-srv')||t.hasAttribute('data-key')){markDirty();return;}
  if(t.id==='recordSearch'){S.recordSearch=t.value;const b=document.getElementById('recordsBody');if(b)b.innerHTML=recordsBody();}
  if(t.id==='probeName')S.probeName=t.value;
  if(t.id==='probeType')S.probeType=t.value;
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&tId(e)==='probeName'){runProbe(e.target.value.trim(),(document.getElementById('probeType')||{}).value||'ANY');}
});
function tId(e){return e.target&&e.target.id;}
window.addEventListener('DOMContentLoaded',boot);
</script>
