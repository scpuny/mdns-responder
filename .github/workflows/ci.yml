# mDNS Responder CI
#
# 每次 push / PR 到 main：
#   1. 语法校验（py_compile 全部 Python / bash -n 全部脚本 / node --check 前端内联 JS）
#   2. 完整自测（tests/selftest.py：离线报文 + 真实组播端到端 + 管理 API + 可观测 + 网关）
#
# 说明：自测会真实绑定 5353 组播 socket 并收发本机组播报文，
# 在 GitHub Runner（临时容器）内可正常执行，且不会影响外部网络。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (3.11+, 零第三方依赖)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (py_compile + bash -n + node --check)
        run: |
          python -m py_compile src/mdns_responder.py src/mdns_insights.py src/admin_server.py src/mdns_probe.py tests/selftest.py
          bash -n start.sh install.sh
          # 前端单文件内联 JS 语法校验（需 node；Runner 预装）
          python - <<'PY'
          import re
          html = open('web/admin.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          open('/tmp/_inline.js', 'w', encoding='utf-8').write('\n;\n'.join(scripts))
          PY
          node --check /tmp/_inline.js

      - name: Full self-test (offline + multicast e2e + admin API)
        run: |
          # start.sh --test = python3 tests/selftest.py --standard-port
          # 89 个断言：离线报文编解码 / 真实组播收发 / QU 单播 / 热重载 /
          # goodbye / 5353 共存 / 管理 API(REST+SSE+鉴权) / 可观测四路由 / 网关友好页 / 日志轮转
          bash start.sh --test
